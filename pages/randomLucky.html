<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Lucky ✦</title>
    <link rel="stylesheet" href="../style/style.css" />
  </head>

  <body>
    <aside class="particles" id="particles" aria-hidden="true"></aside>
    <header class="header">
      <section class="header-left">
        <span class="logo-icon" aria-hidden="true">✦</span>
        <h1 class="logo-title">
          <span>Random Lucky</span>
        </h1>
      </section>
      <aside class="header-right">
        <section
          class="weather-widget"
          id="weatherWidget"
          aria-label="Información meteorológica"
        >
          <span class="weather-icon" id="weatherIcon">⟳</span>
          <section class="weather-info">
            <p class="weather-temp" id="weatherTemp">Cargando...</p>
            <p class="weather-city" id="weatherCity"></p>
          </section>
        </section>
      </aside>
    </header>
    <main>
      <!--Sección de la ruleta -->
        <section class="viewport">
            <div class="wheel-layout">
                <figure class="wheel-container">
                <!-- Position indicator -->
                    <div class="wheel-pointer" aria-hidden="true"></div>
                    <!-- Main disc -->
                    <div class="wheel-body">
                    <!-- Yellow center piece -->
                    <div class="wheel-hub"></div>
                    </div>
                </figure>
          <button class="spin-button" id="spinButton" aria-label="Girar la ruleta">Girar</button>
            </div>
      </section>
    </main>
    <script src="../scripts/script.js"></script>
  </body>
</html>
