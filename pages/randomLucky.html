<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Lucky ✦</title>
  <link rel="stylesheet" href="../style/style.css" />
</head>

<body>
  <aside class="particles" id="particles" aria-hidden="true"></aside>
  <header class="header">
    <section class="header-left">
      <span class="logo-icon" aria-hidden="true">✦</span>
      <h1 class="logo-title">
        <span>Random Lucky</span>
      </h1>
    </section>
    <aside class="header-right">
      <section class="weather-widget" id="weatherWidget" aria-label="Información meteorológica">
        <span class="weather-icon" id="weatherIcon">⟳</span>
        <section class="weather-info">
          <pclass="weather-temp" id="">Cargando...<pclass="weather-temp>
              <p class="weather-city" id="weatherCity"></p>
        </section>
    </aside>
  </header>
  <!-- Sección de Lia -->
  <main>
  <section class="card" aria-labelledby="title-lista">
    
    <h3 id="title-lista">Lista de participantes</h3>

    <!-- Lista de nombres -->
    <ul class="name-list" id="nameList" aria-live="polite">
      <li><span class="dot gold"></span>Marta</li>
      <li><span class="dot gold"></span>Andrea</li>
      <li><span class="dot pink"></span>Jose</li>
      <li><span class="dot pink"></span>Maritza</li>
      <li><span class="dot gold"></span>Silvia</li>
      <li><span class="dot gold"></span>Lorena</li>
    </ul>

    <!-- Formulario -->
    <form id="nameForm" class="form" novalidate>
      <label for="nameInput" class="visually-hidden">
        Escribe un nombre
      </label>

      <input
        type="text"
        id="nameInput"
        name="name"
        placeholder="Escribe un nombre..."
        required
        aria-describedby="errorMsg"
      />

      <p id="errorMsg" class="error" role="alert"></p>

      <div class="buttons">
        <button type="submit" class="btn primary">
          Añadir
        </button>

        <button type="button" id="clearBtn" class="btn secondary">
          LIMPIAR
        </button>
      </div>
    </form>

  </section>
</main>

    <script src="../scripts/script.js"></script>
  </body>
</html>
